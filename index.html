<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walmanac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0d; --panel:#14161a; --panel2:#1b1e23; --line:#272b32; --text:#ece8e1; --muted:#a19d95; --dim:#6b6862; --accent:#e8b04a;
  --serif:'Instrument Serif',Georgia,serif; --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}

/* ---------- header ---------- */
header{flex:none;padding:12px 16px 8px;border-bottom:1px solid var(--line);background:linear-gradient(#0f1114,#0b0c0e);position:relative;z-index:20}
.row1{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-size:24px;letter-spacing:.01em;white-space:nowrap}
.brand i{color:var(--accent)}
.spacer{flex:1}
.yearctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.yearctl button{background:none;border:0;width:34px;height:34px;font-size:18px;color:var(--muted)}
.yearctl button:hover{color:var(--text);background:var(--panel2)}
#year{width:64px;background:none;border:0;color:var(--text);font-family:var(--mono);font-size:16px;text-align:center;-moz-appearance:textfield;appearance:textfield}
#year::-webkit-outer-spin-button,#year::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#year:focus{outline:none}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;height:36px;padding:0 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill:hover{color:var(--text)}
.pill.on{background:var(--accent);color:#1a1408;border-color:var(--accent)}
.dateline{display:flex;align-items:baseline;gap:12px;margin:8px 0 6px;flex-wrap:wrap}
#dateTitle{font-family:var(--serif);font-size:clamp(28px,6vw,44px);line-height:1;color:var(--text);background:none;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:0 0 2px;margin:0;max-width:100%;cursor:text;transition:border-color .2s,color .2s}
#dateTitle:hover{border-bottom-color:var(--line)}
#dateTitle:focus{outline:none;border-bottom-color:var(--accent)}
#dateTitle.bad{border-bottom-color:#e2675a;color:#f3a097}
#dateSub.hint{color:var(--muted)}
.rangewrap{position:relative}
.rangebtn{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.rangebtn:hover,.rangebtn[aria-expanded="true"]{color:var(--text);border-color:var(--accent)}
.rangepop{position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:min(340px,calc(100vw - 24px));padding:14px;border-radius:14px;background:#111317;border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.55)}
.rangepop[hidden]{display:none}
.rp-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px}
.rp-k{width:38px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rp-u{color:var(--muted)}
.rp-step{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:16px;color:var(--muted)}
.rp-step:hover{color:var(--text)}
.rp-row input{width:48px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);text-align:center;font-family:var(--mono);font-size:14px;-moz-appearance:textfield;appearance:textfield}
.rp-row input::-webkit-outer-spin-button,.rp-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rp-presets{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.rp-presets button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.rp-presets button.on{border-color:var(--accent);color:var(--text)}
.rp-check{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:8px;cursor:pointer}
.rp-check input{accent-color:var(--accent);margin:2px 0 0}
.rangepop.auto .rp-row{opacity:.5}
#dateSub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.cal{display:flex;align-items:center;gap:6px}
.cal .mnav{background:none;border:1px solid var(--line);border-radius:8px;width:30px;height:44px;color:var(--muted);flex:none}
.cal .mnav:hover{color:var(--text)}
#monthName{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;width:38px;text-align:center;flex:none;color:var(--accent)}
.days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0;scroll-behavior:smooth}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:38px;height:44px;border-radius:8px;border:1px solid transparent;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--mono);color:var(--muted)}
.day b{font-weight:500;font-size:14px;color:var(--text)}
.day small{font-size:9px;letter-spacing:.06em}
.day.sun small{color:#c77}
.day:hover{border-color:var(--line)}
.day.sel{background:var(--accent);color:#1a1408}
.day.sel b{color:#1a1408}
.day.today{box-shadow:inset 0 -2px 0 var(--accent)}
.day.sel.today{box-shadow:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,#888)}
.chip span{font-family:var(--mono);font-size:10px;color:var(--dim)}
.chip.off{opacity:.38}
.chip.zero{opacity:.25}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;overflow:hidden;min-height:0}
#backdrop{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(50px) saturate(.9);opacity:0;transform:scale(1.1);transition:opacity 1.2s}
#backdrop.on{opacity:.2}
#board{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;cursor:grab}
#board.dragging{cursor:grabbing;user-select:none}
#canvas{position:relative;min-height:100%;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:26px 26px;transition:opacity .3s}
#canvas.dim{opacity:.35;pointer-events:none}
.cluster-label{position:absolute;display:flex;align-items:baseline;gap:10px;pointer-events:none}
.cluster-label h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--c);white-space:nowrap}
.cluster-label span{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}

.tile{position:absolute;border-radius:10px;overflow:hidden;background:var(--panel);
  box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);
  transform:rotate(var(--r)) translateY(14px);opacity:0;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .25s,opacity .5s;outline:none}
.tile.in{opacity:1;transform:rotate(var(--r))}
.tile:hover,.tile:focus-visible{transform:rotate(0) scale(1.035);z-index:10;box-shadow:0 22px 50px rgba(0,0,0,.7),0 0 0 1px var(--c)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05);transition:transform 6s ease}
.tile:hover img{transform:scale(1.06)}
.tile .ico{position:absolute;right:-14%;top:-10%;width:72%;color:var(--c);opacity:.13}
.tile.noimg{background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),var(--panel)}
.tile .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,8,10,.96) 0%,rgba(7,8,10,.7) 38%,rgba(7,8,10,.1) 72%,rgba(7,8,10,0) 100%)}
.tile.noimg .shade{background:none}
.tile .tape{position:absolute;top:-6px;left:50%;width:54px;height:16px;margin-left:-27px;background:rgba(236,232,225,.14);transform:rotate(-3deg);backdrop-filter:blur(2px)}
.tile .body{position:absolute;left:0;right:0;bottom:0;padding:12px 12px 13px}
.meta{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.meta i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.hl{font-size:13.5px;line-height:1.36;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:12px;line-height:1.4;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile.featured .hl{font-family:var(--serif);font-size:clamp(20px,3.2vw,26px);line-height:1.12;-webkit-line-clamp:4}
.tile.year .hl{font-family:var(--serif);font-size:19px;line-height:1.15}
.badge{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.55);color:var(--text);backdrop-filter:blur(4px)}

#status{position:absolute;left:12px;bottom:12px;z-index:5;max-width:calc(100% - 24px);display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(15,17,20,.88);border:1px solid var(--line);font-size:12px;color:var(--muted);backdrop-filter:blur(8px);pointer-events:none}
#status .spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--muted);font-size:14px;line-height:1.5}
#empty h3{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--text);margin:0 0 8px}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#101215;border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
#drawer.open{transform:none}
#close{position:sticky;top:10px;float:right;margin:10px 10px 0 0;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(16,18,21,.9);font-size:20px;line-height:1;z-index:2}
#dbody{padding:0 20px 40px}
.dfig{margin:0 -20px 16px;position:relative;background:#000}
.dfig img{display:block;width:100%;max-height:52vh;object-fit:contain}
.dfig figcaption{font-size:11.5px;color:var(--dim);padding:8px 20px;background:#0c0d10;line-height:1.4}
.dfig figcaption a{color:var(--muted)}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin:16px 0 10px;padding-top:48px}
.dfig + .dmeta{padding-top:0}
.dmeta .chip{height:24px;color:var(--text)}
#dbody h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:0 0 12px}
#dbody .lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 8px}
#dbody h4{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:26px 0 10px}
.src{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none;margin-bottom:8px;transition:border-color .2s,background .2s}
.src:hover{border-color:var(--c,var(--accent));background:var(--panel2)}
.src img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#000}
.src .t{flex:1;min-width:0}
.src b{display:block;font-weight:500;font-size:14px}
.src em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}
.src p{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.src .arr{color:var(--dim);font-size:15px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--dim);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;color:var(--muted);line-height:1.45;word-break:break-word}
.note{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:22px}

/* ---------- gallery mode: pictures only, topics overlapping ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.pill b{font-weight:400}
.pill svg{width:13px;height:13px}
#pinCount{font-family:var(--mono);font-size:11px;color:var(--accent)}
#pinCount:empty{display:none}
.pinrow{display:flex;align-items:center;gap:14px;margin:0 0 10px}
.pinbtn{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--accent);background:none;color:var(--accent);font-size:13px}
.pinbtn.on{background:var(--accent);color:#1a1408}
.pinlink{font-size:12.5px;color:var(--muted);text-decoration:none}
.pinlink:hover{color:var(--text)}
body.gallery{background:#000}
body.gallery header{background:#000;border-bottom-color:transparent;padding-bottom:4px}
body.gallery .brand,body.gallery .yearctl,body.gallery #play,body.gallery #boardLink,body.gallery .cal,body.gallery .chips{display:none}
body.gallery .row1{position:absolute;top:10px;right:12px;z-index:2}
body.gallery .dateline{margin:2px 0 4px}
body.gallery .rangewrap,body.gallery .radio{display:none}

/* ---------- radio dial: a backlit tuning scale, drag the bands under the red needle ---------- */
.radio{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.dial{position:relative;flex:1;min-width:0;padding:4px;border-radius:10px;background:linear-gradient(#3b2617,#1e120a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.45)}
.bands{position:relative;border-radius:6px;overflow:hidden;
  background:radial-gradient(120% 150% at 50% 115%,#ffe6a8 0%,#f1b75b 40%,#b46f22 82%,#6e3f12 100%);
  box-shadow:inset 0 0 14px rgba(60,25,0,.55),inset 0 2px 3px rgba(0,0,0,.35)}
/* glass sheen on top, darker toward the curved ends */
.bands::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 38%),linear-gradient(90deg,rgba(40,15,0,.55),transparent 16%,transparent 84%,rgba(40,15,0,.55))}
.band{position:relative;display:flex;height:30px;cursor:ew-resize;touch-action:none;outline:none;user-select:none;-webkit-user-select:none}
.band.drag{cursor:grabbing}
.band + .band{border-top:1px solid rgba(58,33,15,.25)}
.band b{flex:none;width:44px;display:flex;align-items:center;justify-content:center;font:600 9.5px var(--mono);letter-spacing:.14em;color:rgba(58,33,15,.75);border-right:1px solid rgba(58,33,15,.25)}
.band:focus-visible b{color:#8a1d10}
.band canvas{flex:1;min-width:0;height:100%;display:block}
.needle{position:absolute;top:2px;bottom:2px;left:calc(4px + 44px + (100% - 52px) / 2);width:2px;margin-left:-1px;border-radius:1px;pointer-events:none;
  background:#d42a1c;box-shadow:0 0 6px 1px rgba(255,70,30,.7)}
.knob{flex:none;position:relative;width:48px;height:48px;border-radius:50%;cursor:grab;touch-action:none;
  box-shadow:0 4px 10px rgba(0,0,0,.6),0 0 0 3px #1a0f08,0 0 0 4px rgba(255,255,255,.06)}
.knob .rot{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#2b1a0e 0 5deg,#4a3020 5deg 10deg)}
.knob .rot::before{content:'';position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3d2718,#24160c)}
.knob i{position:absolute;left:50%;top:9px;width:4px;height:11px;margin-left:-2px;border-radius:2px;background:#f0c070;box-shadow:0 0 4px rgba(240,192,112,.6)}
.knob::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.22),transparent 48%)}
.knob.drag{cursor:grabbing}
body.gallery #gallery{opacity:.45;transition:opacity .2s}
body.gallery #gallery:hover{opacity:1}
body.gallery #backdrop{display:none}
body.gallery #board{overflow:hidden;cursor:default}
body.gallery #canvas{background:none;perspective:1400px}
body.gallery #status:not(:has(.spin)){display:none}
.ptile{position:absolute;outline:none;cursor:pointer;opacity:0;
  transform:translate(-50%,-50%) translate(0px,0px) rotate(var(--r)) rotateX(var(--tx)) rotateY(var(--ty)) translateZ(var(--z)) scale(.9);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .3s}
.ptile.in{opacity:1;transform:translate(-50%,-50%) translate(0px,0px) rotate(var(--r)) rotateX(var(--tx)) rotateY(var(--ty)) translateZ(var(--z))}
.ptile .pic{width:100%;height:100%;overflow:hidden;border-radius:3px;background:#111;box-shadow:0 18px 40px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);transition:box-shadow .3s}
.ptile img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05)}
.ptile .cap{position:absolute;top:100%;left:50%;width:max(100%,240px);max-width:min(340px,90vw);margin-top:14px;padding:10px 12px 11px;background:#000;border-radius:4px;
  opacity:0;transform:translate(-50%,-6px);transition:opacity .25s,transform .3s;pointer-events:none}
.ptile .cap.up{top:auto;bottom:100%;margin:0 0 14px;transform:translate(-50%,6px)}
.ptile .cap .hl{-webkit-line-clamp:4}
/* --hx/--hy are set on hover by fitLift() so the lifted picture and its caption stay on screen */
.ptile:hover,.ptile:focus-visible{z-index:1000;transform:translate(-50%,-50%) translate(var(--hx,0px),var(--hy,0px)) rotate(0) rotateX(0) rotateY(0) translateZ(260px)}
.ptile:hover .pic,.ptile:focus-visible .pic{box-shadow:0 40px 90px rgba(0,0,0,.9),0 0 0 1px var(--c)}
.ptile:hover .cap,.ptile:focus-visible .cap{opacity:1;transform:translate(-50%,0)}
#canvas:has(.ptile:hover) .ptile:not(:hover){filter:brightness(.35) grayscale(.4)}
.cmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;color:var(--muted)}

@media (max-width:560px){
  header{padding:10px 12px 6px}
  .brand{font-size:21px}
  .pill{padding:0 11px}
  .row1{gap:6px}
  .radio{gap:8px;margin-top:8px}
  .band{height:28px}
  .band b{width:36px;font-size:8.5px}
  .needle{left:calc(4px + 36px + (100% - 44px) / 2)}
  .knob{width:42px;height:42px}
  .pill .lbl{display:none}   /* icons only, so the header fits a phone */
  .cluster-label h2{font-size:26px}
}
</style>
</head>
<body>
<header>
  <div class="row1">
    <div class="brand"><i>Wal</i>manac</div>
    <div class="spacer"></div>
    <div class="yearctl">
      <button id="yPrev" aria-label="Previous year">−</button>
      <input id="year" type="number" inputmode="numeric" min="1" aria-label="Year">
      <button id="yNext" aria-label="Next year">+</button>
    </div>
    <button id="play" class="pill" title="Advance one day every few seconds"><b>▶</b><span class="lbl">Follow</span></button>
    <button id="gallery" class="pill" title="Pictures only, full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">Gallery</span></button>
    <a id="boardLink" class="pill" href="board.html" title="Your pinned articles"><b>📌</b><span class="lbl">Board</span><span id="pinCount"></span></a>
  </div>
  <div class="radio" id="radio">
    <div class="dial">
      <div class="bands">

<script>
(() => {
'use strict';

/* ================= constants ================= */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = MONTHS.map(m => m.slice(0,3));
const WD = ['S','M','T','W','T','F','S'];
const NOW = new Date();
const MAXY = NOW.getFullYear();

const ICONS = {

const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

/* Display order of clusters on the wall */
const TOPICS = [
  {id:'war', name:'War & Conflict', color:'#e2675a', icon:'war',
   re:/\b(wars?\b|warfare|battle|army|armies|troops|invasion|invade|military|bomb|siege|armistice|naval|navy|soldiers?\b|missiles?\b|guerrilla|rebels?\b|coup\b|airstrike|cease-?fire|insurgen|offensive\b|massacre|hostage|terroris)/i,
   search:'war OR battle OR military OR offensive OR conflict'},
  {id:'science', name:'Science', color:'#6fd3a8', icon:'science',
   re:/\b(scien|physic|chemi|biolog|discover|theory|laborator|nobel|fossil|telescope|genom|dna\b|astronom|mathemat|experiment|species|archaeolog|geolog)/i,

   re:/\b(electr|computer|transistor|semiconductor|radio|television|telephone|internet|software|microprocessor|telegraph|video games?\b|nintendo|atari|ibm\b|intel\b|microsoft|macintosh|laser|digital|broadcast)/i,
   search:'computer OR electronics OR television OR software OR "video games"'},
  {id:'transport', name:'Transport & Aviation', color:'#4a90d9', icon:'plane',
   re:/\b(aviation|airlines?\b|aircraft|airplane|aeroplane|airport|airship|zeppelin|flights?\b|automobiles?\b|motor|cars?\b|trucks?\b|railways?\b|railroad|locomotive|subway|metro\b|steamship|ocean liner|ferry|highway|motorway|bicycle|helicopter|concorde|boeing)/i,
   search:'aviation OR airline OR automobile OR railway OR ship'},
  {id:'plumbing', name:'Plumbing & Infrastructure', color:'#d9a15b', icon:'pipe',
   re:/\b(plumb|water supply|sewer|sewage|pipelines?\b|pipes?\b|aqueduct|dams?\b|canal|reservoir|sanitation|waterworks|water main|irrigation|toilet|bridges?\b|tunnel|skyscraper|power station|power plant)/i,
   search:'water OR pipeline OR dam OR bridge OR tunnel'},
  {id:'pictures', name:'Pictures', color:'#f0d36a', icon:'camera', re:null, search:null},
  {id:'space', name:'Space', color:'#8fa8ff', icon:'space',
   re:/\b(space|nasa\b|orbit|satellite|moon\b|lunar|mars\b|rocket|astronaut|cosmonaut|space shuttle|planet|comet|spacecraft|soyuz|apollo|sputnik|voyager|hubble|asteroid)/i,
   search:'spaceflight OR satellite OR rocket OR NASA OR astronaut'},
  {id:'exploration', name:'Exploration', color:'#6fa8a8', icon:'compass',
   re:/\b(expeditions?\b|explorers?\b|exploration|first to reach|first ascent|everest|north pole|south pole|antarctic|arctic|circumnavigat|voyage|uncharted|transatlantic|transpacific)/i,
   search:'expedition OR explorer OR Antarctic OR voyage'},
  {id:'medicine', name:'Medicine & Health', color:'#ef8fb4', icon:'med',
   re:/\b(medic|hospital|vaccin|disease|surg|virus|epidemic|pandemic|aids\b|hiv\b|transplant|penicillin|cancer|polio|health|physician|nurse|smallpox|cholera|plague|insulin)/i,
   search:'health OR medicine OR epidemic OR disease OR vaccine'},
  {id:'nature', name:'Nature & Environment', color:'#3f9f5f', icon:'leaf',
   re:/\b(environment|climate|national park|wildlife|conservation|endangered|extinct|pollution|oil spill|deforest|rainforest|ozone|species|nature reserve|zoo\b|whal|glacier|earth day)/i,
   search:'environment OR wildlife OR "national park" OR conservation OR climate'},
  {id:'disaster', name:'Disasters', color:'#ff9a5c', icon:'disaster',
   re:/\b(earthquake|hurricane|typhoon|cyclone|tornado|crash|disaster|explosion|explode|fire\b|blaze|tsunami|erupt|sinks|sank|capsiz|derail|famine|flood|avalanche|collapse|shipwreck)/i,
   search:'earthquake OR hurricane OR disaster OR crash OR flood'},
  {id:'culture', name:'Arts & Culture', color:'#c9a7f0', icon:'culture',
   re:/\b(album|films?\b|movie|music|novel|painting|museum|premiere|broadway|songs?\b|opera|theat|festival|poet|artist|sculpt|ballet|published|bestsell|comic|rock band|singer)/i,
   search:'film OR music OR art OR album OR novel'},
  {id:'sports', name:'Sports', color:'#9ad35a', icon:'ball',
   re:/\b(olympic|championship|world cup|world series|super bowl|football|soccer|baseball|basketball|cricket|tennis|golf|boxing|marathon|athletes?\b|stadium|tournament|grand prix|wimbledon|tour de france|hockey|rugby|medal|chess|heavyweight|home run|world record)/i,
   search:'sport OR championship OR Olympics OR tournament OR season'},
  {id:'business', name:'Business & Economy', color:'#c2b280', icon:'chart',
   re:/\b(compan(y|ies)\b|corporation|stock market|stock exchange|shares?\b|banks?\b|banking|econom|trade agreement|tariff|merger|acquires|bankrupt|currency|inflation|recession|great depression|industr|factory|labou?r strike|general strike|workers|dow jones|wall street|retail|brand)/i,
   search:'company OR economy OR "stock market" OR bank OR trade'},
  {id:'crime', name:'Crime & Justice', color:'#b07a6a', icon:'scales',
   re:/\b(murder|assassinat|arrested|trial\b|convicted|sentenced|robbery|heist|kidnap|gangster|mafia|police|prison|supreme court|lawsuit|verdict|crimes?\b|criminal|serial killer|smuggl|hijack|fugitive)/i,
   search:'murder OR trial OR court OR crime OR assassination'},
  {id:'religion', name:'Religion', color:'#e6d7b8', icon:'temple',
   re:/\b(church|pope|papal|vatican|cathedral|bishop|archbishop|religio|christian|catholic|protestant|muslim|islam|mosque|jewish|judaism|synagogue|hindu|buddhis|temple|saint\b|canoniz|monaster|pilgrim)/i,
   search:'church OR pope OR religion OR temple OR cathedral'},
  {id:'world', name:'World & Politics', color:'#a3b0c2', icon:'globe', re:null,
   search:'election OR treaty OR summit OR protest'}
];
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
/* Priority for classifying an event sentence: the more specific topics get first pick */
const CLASS_ORDER = ['space','medicine','electronics','exploration','war','sports','disaster','transport','crime','religion','nature',
                     'plumbing','business','science','culture'];

/* ================= utilities ================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = (n) => String(n).padStart(2,'0');
function utc(y,m,d){ const t = new Date(Date.UTC(2000,0,1)); t.setUTCFullYear(y, m-1, d); return t; }
function daysIn(y,m){ const t = utc(y,m,1); t.setUTCMonth(m); t.setUTCDate(0); return t.getUTCDate(); }
const fmt = (dt) => `${MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}, ${dt.getUTCFullYear()}`;
const fmtShort = (dt) => `${MON3[dt.getUTCMonth()]} ${dt.getUTCDate()}`;
const parser = new DOMParser();
function strip(html){ if(!html) return ''; const doc = parser.parseFromString(String(html),'text/html'); return (doc.body.textContent||'').replace(/\s+/g,' ').trim(); }
function hash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function fileFromUrl(u){ const m = String(u||'').match(/\/wikipedia\/[^/]+\/(?:thumb\/)?[0-9a-f]\/[0-9a-f]{2}\/([^/?#]+)/); return m ? m[1] : null; }
function prettyFile(f){ try{ return decodeURIComponent(f).replace(/_/g,' '); }catch{ return f.replace(/_/g,' '); } }
function parseDate(s){
  if(!s) return null; let m;
  if((m = s.match(/(\d{4})-(\d{2})-(\d{2})/))) return utc(+m[1],+m[2],+m[3]);
  const mn = MONTHS.join('|');
  if((m = s.match(new RegExp(`(${mn})\\s+(\\d{1,2}),?\\s+(\\d{4})`,'i')))) return utc(+m[3], monthIdx(m[1]), +m[2]);
  if((m = s.match(new RegExp(`(\\d{1,2})\\s+(${mn})\\s+(\\d{4})`,'i')))) return utc(+m[3], monthIdx(m[2]), +m[1]);
  if((m = s.match(/(\d{4})-(\d{2})/))) return utc(+m[1],+m[2],15);
  return null;
}
function monthIdx(name){ return MONTHS.findIndex(x => x.toLowerCase() === name.toLowerCase()) + 1; }

const cache = new Map();
function getJSON(url){
  if(cache.has(url)) return cache.get(url);
  // Wikimedia answers 429 when we ask too fast (e.g. spinning the dial); wait a moment and try again
  const attempt = (n) => fetch(url).then(r => {
    if(r.status === 429 && n < 3) return new Promise(res => setTimeout(res, 700 * (n + 1) + Math.random() * 400)).then(() => attempt(n + 1));
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
  const p = attempt(0);
  cache.set(url, p); p.catch(() => cache.delete(url));
  return p;
}
async function pool(items, n, fn){
  let i = 0, ok = 0, fail = 0;
  const run = async () => { while(i < items.length){ const it = items[i++]; try{ await fn(it); ok++; }catch(e){ fail++; } } };
  await Promise.all(Array.from({length:Math.min(n, items.length)}, run));
  return {ok, fail};
}
function classify(text, extra){
  for(const id of CLASS_ORDER) if(TOPIC[id].re.test(text)) return id;
  if(extra) for(const id of CLASS_ORDER) if(TOPIC[id].re.test(extra)) return id;
  return 'world';
}

/* ================= data sources ================= */
async function onThisDay(m, d){
  const mm = pad2(m), dd = pad2(d);
  const urls = [
    `https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${dd}`,
    `https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/events/${mm}/${dd}`
  ];
  let last;
  for(const u of urls){ try{ const j = await getJSON(u); return j.events || []; }catch(e){ last = e; } }
  throw last || new Error('unavailable');
}

function pageInfo(p){
  const title = p.titles?.normalized || p.normalizedtitle || String(p.title||'').replace(/_/g,' ');
  return {
    title,
    url: p.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(String(p.title||'').replace(/ /g,'_'))}`,
    desc: p.description || '',
    extract: p.extract || '',
    thumb: p.thumbnail?.source || ''
  };
}

async function nearDate(y, m, d, before, after){
  const base = utc(y, m, d).getTime();
  const offsets = []; for(let k=-before; k<=after; k++) offsets.push(k);
  const out = [];
  const res = await pool(offsets, 6, async (k) => {
    const dt = new Date(base + k*864e5);
    const evs = await onThisDay(dt.getUTCMonth()+1, dt.getUTCDate());
    const ty = dt.getUTCFullYear();
    evs.forEach((e, idx) => {
      if(e.year !== ty) return;
      const pages = (e.pages || []);
      const withImg = pages.find(p => p.thumbnail?.source);
      let img = null;
      if(withImg){
        const o = withImg.originalimage;
        const large = (o && o.width && o.width <= 1600 && !/\.tiff?$/i.test(o.source)) ? o.source : withImg.thumbnail.source;
        img = {thumb: withImg.thumbnail.source, large, file: fileFromUrl(withImg.thumbnail.source)};
      }
      const extra = pages.map(p => `${p.description||''} ${(p.titles?.normalized||p.title||'')}`).join(' ');
      out.push({
        id: `e:${dt.toISOString().slice(5,10)}:${idx}`, kind:'event',
        topic: classify(e.text||'', extra),
        date: dt, offset: k, text: e.text || '', img,
        pages: pages.map(pageInfo),
        dayPage: `https://en.wikipedia.org/wiki/${MONTHS[dt.getUTCMonth()]}_${dt.getUTCDate()}`,
        dayName: `${MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}`
      });
    });
  });
  if(res.ok === 0) throw new Error('Could not reach Wikipedia');
  return out;
}

async function yearTopic(y, t){
  const q = `intitle:${y} ${t.search}`;
  const url = 'https://en.wikipedia.org/w/api.php?' + new URLSearchParams({
    action:'query', format:'json', origin:'*', generator:'search', gsrsearch:q, gsrlimit:'6', gsrnamespace:'0',
    prop:'pageimages|extracts|info', piprop:'thumbnail|name', pithumbsize:'500',
    exintro:'1', explaintext:'1', exsentences:'2', exlimit:'max', inprop:'url'
  });
  const j = await getJSON(url);
  const pages = Object.values(j.query?.pages || {}).sort((a,b) => (a.index||0) - (b.index||0));
  return pages
    .filter(p => p.title !== String(y) && !/disambiguation/i.test(p.title))
    .map(p => ({
      id: 'y:' + p.title, kind:'year', topic: t.id, title: p.title, text: p.extract || '',
      img: p.thumbnail?.source ? {thumb: p.thumbnail.source, large: p.thumbnail.source, file: p.pageimage ? encodeURIComponent(p.pageimage) : fileFromUrl(p.thumbnail.source)} : null,
      pages: [{title: p.title, url: p.fullurl || `https://en.wikipedia.org/wiki/${encodeURIComponent(p.title)}`, desc:'', extract: p.extract || '', thumb: p.thumbnail?.source || ''}],
      query: q
    }));
}

function commonsURL(q, n){
  return 'https://commons.wikimedia.org/w/api.php?' + new URLSearchParams({
    action:'query', format:'json', origin:'*', generator:'search', gsrnamespace:'6', gsrsearch:q, gsrlimit:String(n),
    prop:'imageinfo', iiprop:'url|extmetadata', iiurlwidth:'960',
    iiextmetadatafilter:'Artist|LicenseShortName|ImageDescription|DateTimeOriginal|ObjectName|Credit'
  });
}
async function commonsPics(y, m, d){
  const all = new Map();
  const add = (j) => { for(const p of Object.values(j.query?.pages || {})) all.set(p.title, p); };
  await Promise.all([`"${y}-${pad2(m)}" filetype:bitmap`, `"${MONTHS[m-1]} ${y}" filetype:bitmap`].map(async q => {
    try{ add(await getJSON(commonsURL(q, 15))); }catch(e){}
  }));
  if(all.size < 4){ try{ add(await getJSON(commonsURL(`${y} photograph filetype:bitmap`, 12))); }catch(e){} }
  const target = utc(y, m, d).getTime();
  const out = [];
  for(const p of all.values()){
    const ii = p.imageinfo?.[0]; if(!ii || !ii.thumburl) continue;
    const md = ii.extmetadata || {};
    const dt = parseDate(strip(md.DateTimeOriginal?.value || ''));
    if(dt && dt.getUTCFullYear() !== y) continue;
    const name = p.title.replace(/^File:/,'').replace(/\.[a-z0-9]+$/i,'').replace(/_/g,' ');
    out.push({
      id: 'c:' + p.title, kind:'pic', topic:'pictures',
      title: strip(md.ObjectName?.value) || name,
      text: strip(md.ImageDescription?.value).slice(0, 600),
      date: dt, dist: dt ? Math.abs(dt.getTime() - target)/864e5 : 9999,
      img: {thumb: ii.thumburl, large: ii.thumburl},
      fileUrl: ii.descriptionurl, fileName: p.title,
      artist: strip(md.Artist?.value), license: strip(md.LicenseShortName?.value), credit: strip(md.Credit?.value)
    });
  }
  out.sort((a,b) => a.dist - b.dist);
  return out.slice(0, 8);
}

/* ================= state ================= */
const state = { y:1987, m:NOW.getMonth()+1, d:NOW.getDate(), off:new Set(), items:[], span:{before:7, after:7}, featured:null, gallery:false,
  range: {auto:true, before:7, after:7, year:true} };
const RANGE_KEY = 'walmanac.range', RANGE_MAX = 60;
try{
  const r = JSON.parse(localStorage.getItem(RANGE_KEY));
  if(r && typeof r === 'object') state.range = {
    auto: r.auto !== false, year: r.year !== false,
    before: Math.max(0, Math.min(RANGE_MAX, r.before|0)), after: Math.max(0, Math.min(RANGE_MAX, r.after|0))
  };
}catch(e){}
(function readHash(){
  const m = location.hash.match(/^#(\d{1,4})-(\d{2})-(\d{2})$/);
  if(m){ const y=+m[1], mo=+m[2], d=+m[3]; if(y>=1 && y<=MAXY && mo>=1 && mo<=12 && d>=1 && d<=daysIn(y,mo)){ state.y=y; state.m=mo; state.d=d; } }
  if(state.d > daysIn(state.y, state.m)) state.d = daysIn(state.y, state.m);
})();

/* ================= header UI ================= */
const yearIn = $('#year'); yearIn.max = MAXY;
function setDate(y, m, d, opts={}){
  y = Math.max(1, Math.min(MAXY, y|0));
  d = Math.min(d, daysIn(y, m));
  const changed = y!==state.y || m!==state.m || d!==state.d;
  state.y = y; state.m = m; state.d = d;
  renderHeader();
  try{ history.replaceState(null, '', `#${y}-${pad2(m)}-${pad2(d)}`); }catch(e){}
  if(changed || opts.force) load();
}
function stepDay(n){
  // revolving: wraps inside the selected year
  let doy = dayOfYear(state.y, state.m, state.d) + n;
  const len = dayOfYear(state.y, 12, 31);
  doy = ((doy - 1) % len + len) % len + 1;
  const dt = new Date(utc(state.y,1,1).getTime() + (doy-1)*864e5);
  setDate(state.y, dt.getUTCMonth()+1, dt.getUTCDate());
}
function stepMonth(n){ const m = ((state.m - 1 + n) % 12 + 12) % 12 + 1; setDate(state.y, m, state.d); }
function dayOfYear(y,m,d){ return Math.round((utc(y,m,d) - utc(y,1,1))/864e5) + 1; }

    const b = document.createElement('button');
    const wdi = utc(y,m,i).getUTCDay();
    b.className = 'day' + (i===d?' sel':'') + (wdi===0?' sun':'') + (isToday(i)?' today':'');

}

/* the big date is a text field: click it, type a date, Enter to go, Esc to cancel */

function fitDate(){
  const cs = getComputedStyle(dateIn);
  measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  dateIn.style.width = Math.ceil(measureCtx.measureText(dateIn.value || ' ').width) + 8 + 'px';
}
function parseUserDate(s){
  s = s.trim().replace(/(\d)(st|nd|rd|th)\b/gi, '$1').replace(/,/g, ' ').replace(/\s+/g, ' ');
  const mon = (w) => w.length < 3 ? 0 : MONTHS.findIndex(x => x.toLowerCase().startsWith(w.toLowerCase())) + 1;
  let m, y, mo, d;
  if((m = s.match(/^(\d{1,4})-(\d{1,2})-(\d{1,2})$/))) [y, mo, d] = [+m[1], +m[2], +m[3]];
  else if((m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{1,4})$/))) [mo, d, y] = [+m[1], +m[2], +m[3]];
  else if((m = s.match(/^([a-z]+)\.? (\d{1,2}) (\d{1,4})$/i))) [mo, d, y] = [mon(m[1]), +m[2], +m[3]];
  else if((m = s.match(/^(\d{1,2}) ([a-z]+)\.? (\d{1,4})$/i))) [d, mo, y] = [+m[1], mon(m[2]), +m[3]];
  else if((m = s.match(/^([a-z]+)\.? (\d{1,2})$/i))) [mo, d, y] = [mon(m[1]), +m[2], state.y];
  else if((m = s.match(/^(\d{1,4})$/))) [mo, d, y] = [state.m, Math.min(state.d, daysIn(+m[1] || 1, state.m)), +m[1]];
  else return null;
  if(!(y >= 1 && y <= MAXY && mo >= 1 && mo <= 12 && d >= 1 && d <= daysIn(y, mo))) return null;
  return {y, m:mo, d};
}

/* ================= radio dial ================= */
/* Two bands slide under a fixed needle like an old tuning scale: YEAR (1 tick a year) and DAY (1 tick a day of
   the chosen year). Drag and let go to glide, it clicks onto the nearest mark, and only then is the date loaded.
   Tapping a spot on a band tunes to it; the wheel, arrow keys and the knob work too. */
const radio = (() => {
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const INK = '#3a210f';
  const doyDate = (y, n) => new Date(utc(y, 1, 1).getTime() + (n - 1) * 864e5);
  function preview(y, m, d){ if(document.activeElement !== dateIn){ dateIn.value = `${MONTHS[m-1]} ${d}, ${y}`; fitDate(); } }

  function band(el, o){
    const cv = el.querySelector('canvas'), ctx = cv.getContext('2d');
    let pos = o.value(), W = 0, H = 0, drag = null, anim = 0, vel = 0, snapTo = null, wheelT, commitT;

    function size(){
      const dpr = Math.min(2, devicePixelRatio || 1);
      W = cv.clientWidth; H = cv.clientHeight; if(!W) return;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }
    function draw(){
      if(!W) return;
      ctx.clearRect(0, 0, W, H);
      const px = o.px, base = H - 3;
      const lo = Math.max(o.min(), Math.floor(pos - W / 2 / px) - 2), hi = Math.min(o.max(), Math.ceil(pos + W / 2 / px) + 2);
      ctx.fillStyle = INK;
      ctx.globalAlpha = .5; ctx.fillRect(0, base, W, 1); ctx.globalAlpha = 1;
      for(let v = lo; v <= hi; v++){
        const x = Math.round(W / 2 + (v - pos) * px), t = o.tick(v);
        ctx.globalAlpha = t.h > 6 ? .95 : .6;
        ctx.fillRect(x, base - t.h, 1, t.h);
        if(t.label){
          ctx.globalAlpha = .9;
          ctx.font = '600 10px "IBM Plex Mono", ui-monospace, monospace';
          ctx.textAlign = t.left ? 'left' : 'center';
          ctx.fillText(t.label, x + (t.left ? 4 : 0), t.left ? base - 3 : base - t.h - 3);
        }
      }
      ctx.globalAlpha = 1;
      const v = Math.round(pos);
      el.setAttribute('aria-valuemax', o.max()); el.setAttribute('aria-valuenow', v); el.setAttribute('aria-valuetext', o.text(v));
      if(o.turned) o.turned(pos);
    }
    function setPos(p){ pos = Math.max(o.min(), Math.min(o.max(), p)); draw(); o.preview(Math.round(pos)); }
    function stop(){ cancelAnimationFrame(anim); anim = 0; }
    // glide on whatever speed the drag left, then ease onto a mark and tune in
    function settle(commit = true){
      stop();
      let last = performance.now();
      const step = (now) => {
        const dt = Math.min(40, now - last); last = now;
        if(Math.abs(vel) > .002 && !still){
          setPos(pos + vel * dt); vel *= Math.pow(.994, dt);
          if(pos <= o.min() || pos >= o.max()) vel = 0;
          anim = requestAnimationFrame(step); return;
        }
        vel = 0;
        const target = snapTo ?? Math.round(pos), d = target - pos;
        if(Math.abs(d) > .01 && !still){ setPos(pos + d * Math.min(1, dt * .018)); anim = requestAnimationFrame(step); return; }
        anim = 0; snapTo = null; setPos(target);
        if(commit){ clearTimeout(commitT); commitT = setTimeout(() => o.commit(target), 120); }
      };
      anim = requestAnimationFrame(step);
    }
    function goTo(v, commit = true){ snapTo = Math.max(o.min(), Math.min(o.max(), v)); vel = 0; settle(commit); }

    el.addEventListener('pointerdown', e => {
      if(e.button > 0) return;
      stop(); clearTimeout(commitT);
      el.setPointerCapture(e.pointerId); el.focus({preventScroll: true});
      drag = {x: e.clientX, p: pos, lx: e.clientX, t: performance.now(), moved: 0};
      vel = 0; el.classList.add('drag');
    });
    el.addEventListener('pointermove', e => {
      if(!drag) return;
      const now = performance.now(), dt = Math.max(1, now - drag.t);
      vel = vel * .6 + (-(e.clientX - drag.lx) / o.px / dt) * .4;
      drag.t = now; drag.lx = e.clientX; drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.x));
      setPos(drag.p - (e.clientX - drag.x) / o.px);
    });
    const release = (e) => {
      if(!drag) return;
      const d = drag; drag = null; el.classList.remove('drag');
      if(d.moved < 4){   // a tap: tune to the mark under the finger
        const r = cv.getBoundingClientRect();
        if(e.clientX >= r.left) return goTo(Math.round(pos + (e.clientX - r.left - W / 2) / o.px));
        return goTo(Math.round(pos));
      }
      if(performance.now() - d.t > 80) vel = 0;   // held still before letting go: no glide
      const cap = 2 / o.px;                        // a hard flick glides about 330px of scale at most
      vel = Math.max(-cap, Math.min(cap, vel));
      settle();
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('wheel', e => {
      e.preventDefault(); stop(); clearTimeout(commitT);
      setPos(pos + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / o.px * .35);
      clearTimeout(wheelT); wheelT = setTimeout(() => settle(), 160);
    }, {passive: false});
    el.addEventListener('keydown', e => {
      const n = Math.round(snapTo ?? pos), k = {ArrowLeft: -1, ArrowRight: 1, ArrowDown: -1, ArrowUp: 1, PageDown: -o.page, PageUp: o.page}[e.key];
      if(k){ e.preventDefault(); e.stopPropagation(); goTo(n + k); }
      else if(e.key === 'Home' || e.key === 'End'){ e.preventDefault(); e.stopPropagation(); goTo(e.key === 'Home' ? o.min() : o.max()); }
    });
    new ResizeObserver(size).observe(cv);

    return {
      size, draw, stop, setPos, settle, get pos(){ return pos; },
      // follow date changes made elsewhere, without tuning in again
      sync(v){
        if(drag || (anim && snapTo === v)) return;
        if(Math.abs(v - pos) > 120 || still){ stop(); pos = v; draw(); return; }
        if(Math.abs(v - pos) > .01) goTo(v, false); else draw();
      }
    };
  }

  const knobRot = $('#knob .rot');
  const yearBand = band($('#bandYear'), {
    px: 13, page: 10, min: () => 1, max: () => MAXY, value: () => state.y, text: String,
    tick: (v) => v % 10 === 0 ? {h: 10, label: String(v)} : v % 5 === 0 ? {h: 7} : {h: 4},
    preview: (v) => preview(v, state.m, Math.min(state.d, daysIn(v, state.m))),
    commit: (v) => { if(v !== state.y){ stopPlay(); setDate(v, state.m, state.d); } },
    turned: (p) => { knobRot.style.transform = `rotate(${(p * 12) % 360}deg)`; }
  });
  const dayBand = band($('#bandDay'), {
    px: 6, page: 30, min: () => 1, max: () => dayOfYear(state.y, 12, 31), value: () => dayOfYear(state.y, state.m, state.d),
    text: (v) => fmt(doyDate(state.y, v)),
    tick: (v) => {
      const dt = doyDate(state.y, v), d = dt.getUTCDate();
      return d === 1 ? {h: 13, label: MON3[dt.getUTCMonth()].toUpperCase(), left: true} : d === 15 ? {h: 8} : d % 5 === 0 ? {h: 5} : {h: 3};
    },
    preview: (v) => { const dt = doyDate(state.y, v); preview(state.y, dt.getUTCMonth() + 1, dt.getUTCDate()); },
    commit: (v) => {
      const dt = doyDate(state.y, v), m = dt.getUTCMonth() + 1, d = dt.getUTCDate();
      if(m !== state.m || d !== state.d){ stopPlay(); setDate(state.y, m, d); }
    }
  });

  // the knob turns the year: 12° of turn per year, so a full turn is 30 years
  const knob = $('#knob');
  let kd = null;
  const angle = (e) => { const r = knob.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
  knob.addEventListener('pointerdown', e => { yearBand.stop(); knob.setPointerCapture(e.pointerId); knob.classList.add('drag'); kd = {a: angle(e), p: yearBand.pos, turn: 0}; });
  knob.addEventListener('pointermove', e => {
    if(!kd) return;
    const a = angle(e); let da = a - kd.a;
    if(da > Math.PI) da -= 2 * Math.PI; else if(da < -Math.PI) da += 2 * Math.PI;   // unwrap across ±180°
    kd.turn += da; kd.a = a;
    yearBand.setPos(kd.p + kd.turn / (Math.PI / 15));
  });
  const knobUp = () => { if(!kd) return; kd = null; knob.classList.remove('drag'); yearBand.settle(); };
  knob.addEventListener('pointerup', knobUp);
  knob.addEventListener('pointercancel', knobUp);
  knob.addEventListener('wheel', e => { e.preventDefault(); $('#bandYear').dispatchEvent(new WheelEvent('wheel', e)); }, {passive: false});

  if(document.fonts) document.fonts.ready.then(() => { yearBand.draw(); dayBand.draw(); });
  return { sync(){ yearBand.sync(state.y); dayBand.sync(dayOfYear(state.y, state.m, state.d)); } };
})();

/* ================= loading ================= */
let token = 0;
function setStatus(html, spin){ $('#status').innerHTML = (spin ? '<div class="spin"></div>' : '') + `<span>${html}</span>`; }

async function load(){
  const my = ++token;
  const {y, m, d} = state;
  closeDrawer();
  $('#canvas').classList.add('dim');
  setStatus(`Gathering ${esc(MONTHS[m-1])} ${d}, ${y}…`, true);

  const rg = state.range;
  const pNear = (async () => {
    if(!rg.auto) return {items: await nearDate(y, m, d, rg.before, rg.after), before: rg.before, after: rg.after};
    // auto: start at a week either side and widen on quiet dates
    let span = 7, r = await nearDate(y, m, d, span, span);
    if(r.length < 8){ span = 15; r = await nearDate(y, m, d, span, span); }
    if(r.length < 4){ span = 30; r = await nearDate(y, m, d, span, span); }
    return {items:r, before:span, after:span};
  })();
  const pYear = rg.year ? Promise.allSettled(TOPICS.filter(t => t.search).map(t => yearTopic(y, t))) : Promise.resolve([]);
  const pPics = commonsPics(y, m, d).catch(() => []);

  const [rn, ry, rp] = await Promise.allSettled([pNear, pYear, pPics]);
  if(my !== token) return;

  const near = rn.status === 'fulfilled' ? rn.value.items : [];
  state.span = rn.status === 'fulfilled' ? {before: rn.value.before, after: rn.value.after} : {before: 7, after: 7};
  const perTopic = Math.max(10, Math.min(20, Math.round((state.span.before + state.span.after) / 2) + 4));
  const seen = new Set();
  near.forEach(e => e.pages[0] && seen.add(e.pages[0].title));

  // per-topic: near-date events first (closest), then year highlights
  const byTopic = {};
  near.sort((a,b) => Math.abs(a.offset) - Math.abs(b.offset) || a.offset - b.offset);
  for(const e of near){ (byTopic[e.topic] ||= []); if(byTopic[e.topic].length < perTopic) byTopic[e.topic].push(e); }
  if(ry.status === 'fulfilled'){
    ry.value.forEach(r => {
      if(r.status !== 'fulfilled') return;
      let added = 0;
      for(const it of r.value){
        if(added >= 3 || seen.has(it.title)) continue;
        seen.add(it.title); (byTopic[it.topic] ||= []).push(it); added++;
      }
    });
  }
  // dated photos must fall inside the range; undated ones stay as general pictures of the month
  const target = utc(y, m, d).getTime();
  const pics = (rp.status === 'fulfilled' ? rp.value : []).filter(p => {
    if(!p.date) return true;
    const k = Math.round((p.date.getTime() - target) / 864e5);
    return k >= -state.span.before && k <= state.span.after;
  });
  if(pics.length) byTopic.pictures = pics;

  state.items = TOPICS.flatMap(t => byTopic[t.id] || []);
  // pick from what's actually on the wall (topics are capped at 10 near-date events)
  const feat = state.items.filter(i => i.kind === 'event' && i.img).sort((a,b) => Math.abs(a.offset) - Math.abs(b.offset) || a.offset - b.offset)[0]
            || state.items.find(i => i.img) || null;
  state.featured = feat ? feat.id : null;

  const bd = $('#backdrop');
  if(feat && feat.img){ bd.style.backgroundImage = `url("${feat.img.large.replace(/"/g,'%22')}")`; bd.classList.add('on'); }
  else bd.classList.remove('on');

  $('#canvas').classList.remove('dim');
  renderChips();
  layout(true);

  const empty = $('#empty');
  if(!state.items.length){
    empty.style.display = 'flex';
    empty.innerHTML = rn.status === 'rejected'
      ? `<div><h3>Can't reach Wikipedia</h3>This wall loads live articles and pictures, so it needs an internet connection. Check your connection and pick a date again.</div>`
      : `<div><h3>A quiet stretch</h3>Nothing recorded near this date for ${y}. Try another year or month.</div>`;
    setStatus(rn.status === 'rejected' ? 'Offline or blocked' : 'No panels found');
  } else {
    empty.style.display = 'none';
    const day = utc(y, m, d).getTime(), s = state.span;
    const span = s.before || s.after ? `${fmtShort(new Date(day - s.before*864e5))} – ${fmtShort(new Date(day + s.after*864e5))}` : 'this day only';
    setStatus(`${state.items.length} panels · events ${span}${rg.year ? ` + highlights of ${y}` : ''} · drag to pan, tap for sources`);
  }
}

/* ================= wall layout ================= */
function layout(animate){
  if(state.gallery) return layoutGallery(animate);
  const board = $('#board'), canvas = $('#canvas');
  canvas.querySelectorAll('.tile,.cluster-label,.ptile,.cmsg').forEach(n => n.remove());
  const vw = board.clientWidth || window.innerWidth;
  const mobile = vw < 560;
  const pad = mobile ? 14 : 40, gap = mobile ? 12 : 18, cgap = mobile ? 40 : 70;
  const col = mobile ? Math.floor((vw - pad*2 - gap)/2) : 210;
  const cw = col*2 + gap;

  const groups = TOPICS
    .map(t => ({t, items: state.items.filter(i => i.topic === t.id)}))
    .filter(g => g.items.length && !state.off.has(g.t.id));
  const featTopic = state.items.find(i => i.id === state.featured)?.topic;
  groups.sort((a,b) => (b.t.id===featTopic) - (a.t.id===featTopic));

  const fit = Math.max(1, Math.floor((vw - pad*2 + cgap)/(cw + cgap)));
  const ncols = mobile ? 1 : Math.max(fit, Math.min(3, groups.length));
  const colH = new Array(ncols).fill(pad + 6);
  let order = 0;
  const frag = document.createDocumentFragment();

  for(const g of groups){
    const R = rng(hash(`${state.y}-${state.m}-${state.d}-${g.t.id}`));
    let c = 0; for(let i=1;i<ncols;i++) if(colH[i] < colH[c]) c = i;
    const cx = pad + c*(cw + cgap) + (mobile ? 0 : (R()-.5)*30);
    const cy = colH[c] + (mobile ? 0 : R()*24);

    const lab = document.createElement('div');
    lab.className = 'cluster-label';
    lab.style.cssText = `left:${cx}px;top:${cy}px;--c:${g.t.color}`;
    const nNear = g.items.filter(i => i.kind==='event').length;
    lab.innerHTML = `<h2>${esc(g.t.name)}</h2><span>${g.items.length} ${g.items.length===1?'panel':'panels'}${nNear?` · ${nNear} near date`:''}</span>`;
    frag.appendChild(lab);

    const h = [cy + 54, cy + 54];
    g.items.forEach((it) => {
      const featured = it.id === state.featured;
      const span2 = featured;
      const w = span2 ? cw : col;
      const len = (it.text || it.title || '').length;
      let th;
      if(featured) th = Math.round(w * (mobile ? .78 : .66));
      else if(it.img) th = Math.round(col * (1.05 + R()*.35));
      else th = Math.round(col * .62 + Math.min(150, len * .5));
      let x, y;
      if(span2){ y = Math.max(h[0], h[1]); x = cx; h[0] = h[1] = y + th + gap; }
      else { const k = h[0] <= h[1] ? 0 : 1; y = h[k]; x = cx + k*(col + gap); h[k] = y + th + gap; }
      const jx = (R()-.5) * (mobile ? 8 : 22), jy = (R()-.5) * 10;
      const rot = ((R()-.5) * (featured ? 2 : 5)).toFixed(2);
      frag.appendChild(tileEl(it, Math.round(x + jx), Math.round(y + jy), w, th, rot, featured, order++, animate));
    });
    colH[c] = Math.max(h[0], h[1]) + cgap;
  }

  const width = pad*2 + ncols*cw + (ncols-1)*cgap;
  canvas.style.width = Math.max(vw, width) + 'px';
  canvas.style.height = Math.max(...colH) + 40 + 'px';
  canvas.appendChild(frag);
  if(animate){ board.scrollTo({top:0, left:0}); }
  requestAnimationFrame(() => requestAnimationFrame(() => canvas.querySelectorAll('.tile').forEach(t => t.classList.add('in'))));
}

function tileText(it){
  if(it.kind === 'event') return {
    label: it.offset === 0 ? `${fmtShort(it.date)} · this day` : `${fmtShort(it.date)} · ${Math.abs(it.offset)}d ${it.offset < 0 ? 'before' : 'after'}`,
    headline: it.text };
  if(it.kind === 'year') return {label: `${state.y} · from the year`, headline: it.title};
  return {label: it.date ? `${fmtShort(it.date)} · photo` : `${state.y} · photo`, headline: it.title};
}

/* gallery: every picture on one screen, each topic scattered around its own spot so neighbouring topics overlap */
function layoutGallery(animate){
  const board = $('#board'), canvas = $('#canvas');
  canvas.querySelectorAll('.tile,.cluster-label,.ptile,.cmsg').forEach(n => n.remove());
  const W = board.clientWidth || window.innerWidth, H = board.clientHeight || window.innerHeight;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  board.scrollTo({top:0, left:0});

  const groups = TOPICS
    .map(t => ({t, items: state.items.filter(i => i.topic === t.id && i.img)}))
    .filter(g => g.items.length && !state.off.has(g.t.id));
  const n = groups.reduce((s, g) => s + g.items.length, 0);
  if(!n){
    if(state.items.length){ const msg = document.createElement('div'); msg.className = 'cmsg'; msg.textContent = 'No pictures near this date'; canvas.appendChild(msg); }
    return;
  }
  // a grid of cells over the whole screen, filled topic by topic along a snake path,
  // so each topic gets a patch sized to its picture count; tiles are bigger than cells and jittered so patches overlap
  const cols = Math.max(1, Math.round(Math.sqrt(n * W / H))), rows = Math.ceil(n / cols), cells = cols * rows;
  const cw = W / cols, ch = H / rows;
  const ordered = groups.flatMap(g => g.items);
  const R = rng(hash(`${state.y}-${state.m}-${state.d}-gallery`));
  const placed = ordered.map((it, i) => {
    const cell = Math.floor(i * cells / n), row = Math.floor(cell / cols);
    const col = row % 2 ? cols - 1 - cell % cols : cell % cols;
    const featured = it.id === state.featured;
    const w = Math.round(Math.min(W * .8, Math.min(cw * 1.25, ch * 1.5) * (featured ? 1.5 : .85 + R() * .3)));
    const h = Math.round(w * (.7 + R() * .5));
    const x = Math.max(w/2 + 8, Math.min(W - w/2 - 8, (col + .5 + (R() - .5) * .6) * cw));
    const y = Math.max(h/2 + 8, Math.min(H - h/2 - 8, (row + .5 + (R() - .5) * .6) * ch));
    return {it, x, y, w, h, featured, R, k: R()};
  });
  placed.sort((a, b) => (a.featured - b.featured) || (a.k - b.k));   // interleave topics, featured on top

  const frag = document.createDocumentFragment();
  placed.forEach((p, order) => frag.appendChild(photoEl(p, order, animate)));
  canvas.appendChild(frag);
  requestAnimationFrame(() => requestAnimationFrame(() => canvas.querySelectorAll('.ptile').forEach(t => t.classList.add('in'))));
}

/* Lifting a picture toward the viewer (translateZ under the canvas perspective) scales it up AND pushes it
   away from the screen centre, so edge pictures would fly off screen. Work out where it would land and
   shift it back inside, putting the caption below when it fits there, otherwise above. */
const LIFT_P = 1400, LIFT_Z = 260;   // mirror #canvas perspective and the hover translateZ in the CSS
function fitLift(el){
  const cv = el.parentNode; if(!cv) return;
  const W = cv.clientWidth, H = cv.clientHeight, s = LIFT_P / (LIFT_P - LIFT_Z), m = 12;
  const cap = el.querySelector('.cap');
  const w = el.offsetWidth, h = el.offsetHeight, capW = Math.max(w, cap.offsetWidth), capH = cap.offsetHeight + 14;
  const clamp = (v, [lo, hi]) => lo > hi ? (lo + hi) / 2 : Math.max(lo, Math.min(hi, v));
  // where the centre lands on screen when lifted, with no correction
  const px0 = W/2 + (parseFloat(el.style.left) - W/2) * s, py0 = H/2 + (parseFloat(el.style.top) - H/2) * s;
  const px = clamp(px0, [m + capW*s/2, W - m - capW*s/2]);
  const below = [m + h*s/2, H - m - (h/2 + capH)*s], above = [m + (h/2 + capH)*s, H - m - h*s/2];
  const up = Math.abs(clamp(py0, above) - py0) < Math.abs(clamp(py0, below) - py0);
  const py = clamp(py0, up ? above : below);
  cap.classList.toggle('up', up);
  el.style.setProperty('--hx', ((px - px0) / s).toFixed(1) + 'px');
  el.style.setProperty('--hy', ((py - py0) / s).toFixed(1) + 'px');
}

function photoEl({it, x, y, w, h, R}, order, animate){
  const t = TOPIC[it.topic];
  const {label, headline} = tileText(it);
  const el = document.createElement('div');
  el.className = 'ptile'; el.tabIndex = 0; el.setAttribute('role','button'); el.setAttribute('aria-label', headline);
  el.style.cssText = `left:${Math.round(x)}px;top:${Math.round(y)}px;width:${w}px;height:${h}px;--c:${t.color};` +
    `--r:${((R()-.5) * 12).toFixed(2)}deg;--tx:${((R()-.5) * 16).toFixed(1)}deg;--ty:${((R()-.5) * 16).toFixed(1)}deg;--z:${Math.round(-R() * 120)}px;` +
    `transition-delay:${animate ? Math.min(order * 30, 900) : 0}ms`;
  el.innerHTML =
    `<div class="pic"><img alt="" draggable="false" decoding="async" referrerpolicy="no-referrer" src="${esc(w > 260 ? it.img.large : it.img.thumb)}"></div>` +
    `<div class="cap"><div class="meta"><i></i>${esc(label)}</div><div class="hl">${esc(headline)}</div></div>`;
  const img = el.querySelector('img');
  // once the picture arrives, give the frame its real proportions
  img.onload = () => { const r = img.naturalHeight / img.naturalWidth; if(r) el.style.height = Math.round(w * Math.max(.55, Math.min(1.5, r))) + 'px'; };
  img.onerror = () => el.remove();
  if(animate) el.addEventListener('transitionend', () => { el.style.transitionDelay = ''; }, {once:true});
  el.addEventListener('mouseenter', () => fitLift(el));
  el.addEventListener('focus', () => fitLift(el));
  el.addEventListener('click', () => { if(!dragMoved) openItem(it); });
  el.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openItem(it); } });
  return el;
}

function tileEl(it, x, y, w, h, rot, featured, order, animate){
  const t = TOPIC[it.topic];
  const el = document.createElement('div');
  el.className = 'tile' + (featured ? ' featured' : '') + (it.img ? '' : ' noimg') + (it.kind==='year' ? ' year' : '');
  el.tabIndex = 0; el.setAttribute('role','button');
  el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;--r:${rot}deg;--c:${t.color};transition-delay:${animate ? Math.min(order*35, 900) : 0}ms`;

  const {label, headline} = tileText(it);
  const sub = it.kind === 'year' && (!it.img || h > 230) ? it.text : '';
  const src = it.img ? (featured || w > 300 ? it.img.large : it.img.thumb) : '';
  el.innerHTML =
    (src ? `<img alt="" draggable="false" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(src)}">` : '') +
    `<div class="ico">${svg(t.icon)}</div><div class="shade"></div>` +
    (R_TAPE(it.id) ? '<div class="tape"></div>' : '') +
    (featured ? `<div class="badge">Nearest to ${esc(fmtShort(utc(state.y,state.m,state.d)))}</div>` : '') +
    `<div class="body"><div class="meta"><i></i>${esc(label)}</div><div class="hl">${esc(headline)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>`;
  const img = el.querySelector('img');
  if(img) img.onerror = () => { img.remove(); el.classList.add('noimg'); };
  // the stagger delay is only for the entry animation; drop it so hover responds immediately
  if(animate) el.addEventListener('transitionend', () => { el.style.transitionDelay = ''; }, {once:true});
  const open = () => { if(dragMoved) return; openItem(it); };
  el.addEventListener('click', open);
  el.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openItem(it); } });
  return el;
}
function R_TAPE(id){ return hash(id) % 4 === 0; }

let rT; let lastW = 0, lastH = 0;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => {
  const w = $('#board').clientWidth, h = $('#board').clientHeight;
  // the gallery fills exactly one screen, so it also cares about height
  if(w !== lastW || (state.gallery && h !== lastH)){ lastW = w; lastH = h; layout(false); }
}, 200); });

/* mouse drag-to-pan (touch uses native scrolling) */
let dragMoved = false;
(() => {
  const board = $('#board'); let sx, sy, sl, st, down = false;
  board.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    down = true; dragMoved = false; sx = e.clientX; sy = e.clientY; sl = board.scrollLeft; st = board.scrollTop;
  });
  window.addEventListener('pointermove', e => {
    if(!down) return;
    if(!(e.buttons & 1)) return end();   // button released somewhere we didn't hear about
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(!dragMoved && Math.hypot(dx,dy) > 5){
      dragMoved = true; board.classList.add('dragging');
      // capture only once it's a real drag, so plain clicks still reach the tiles
      try{ board.setPointerCapture(e.pointerId); }catch(err){}
    }
    if(dragMoved){ board.scrollLeft = sl - dx; board.scrollTop = st - dy; }
  });
  function end(){ if(!down) return; down = false; board.classList.remove('dragging'); setTimeout(() => dragMoved = false, 0); }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  board.addEventListener('dragstart', e => e.preventDefault());
})();

/* ================= detail drawer ================= */
function srcCard(p, color){
  return `<a class="src" style="--c:${color}" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">
    ${p.thumb ? `<img alt="" loading="lazy" referrerpolicy="no-referrer" src="${esc(p.thumb)}">` : ''}
    <div class="t"><b>${esc(p.title)}</b>${p.desc ? `<em>${esc(p.desc)}</em>` : ''}${p.extract ? `<p>${esc(p.extract)}</p>` : ''}</div>
    <span class="arr">↗</span></a>`;
}
/* pins are shared with board.html through localStorage (same site, same browser) */
const PIN_KEY = 'walmanac.pins';
function readPins(){ try{ const p = JSON.parse(localStorage.getItem(PIN_KEY)); return Array.isArray(p) ? p : []; }catch(e){ return []; } }
function writePins(p){ try{ localStorage.setItem(PIN_KEY, JSON.stringify(p)); }catch(e){} updatePinCount(); }
function isPinned(id){ return readPins().some(p => p.id === id); }
function togglePin(it){
  const pins = readPins(), i = pins.findIndex(p => p.id === it.id);
  if(i >= 0) pins.splice(i, 1);
  else {
    const t = TOPIC[it.topic];
    pins.push({
      id: it.id, kind: it.kind, topic: t.name, color: t.color,
      label: it.date ? fmt(it.date) : String(state.y), title: tileText(it).headline,
      img: it.img ? it.img.thumb : '',
      url: it.kind === 'pic' ? it.fileUrl : (it.pages[0]?.url || it.dayPage),
      wall: `${state.y}-${pad2(state.m)}-${pad2(state.d)}`
    });
  }
  writePins(pins);
  return i < 0;
}
function updatePinCount(){ const n = readPins().length; $('#pinCount').textContent = n || ''; }
window.addEventListener('storage', e => { if(e.key === PIN_KEY) updatePinCount(); });

function openItem(it){
  const t = TOPIC[it.topic];
  let html = '';
  if(it.img){
    let cap;
    if(it.kind === 'pic') cap = `Wikimedia Commons · <a href="${esc(it.fileUrl)}" target="_blank" rel="noopener noreferrer">${esc(it.fileName.replace(/^File:/,''))}</a>`;
    else if(it.img.file) cap = `Image: <a href="https://en.wikipedia.org/wiki/File:${esc(it.img.file)}" target="_blank" rel="noopener noreferrer">${esc(prettyFile(it.img.file))}</a> — author and license on the file page`;
    else cap = 'Image from the linked Wikipedia article';
    html += `<figure class="dfig"><img alt="" referrerpolicy="no-referrer" src="${esc(it.img.large)}" onerror="this.parentNode.remove()"><figcaption>${cap}</figcaption></figure>`;
  }
  const chip = `<span class="chip" style="--c:${t.color}"><i></i>${esc(t.name)}</span>`;

  if(it.kind === 'event'){
    const rel = it.offset === 0 ? 'the selected day' : `${Math.abs(it.offset)} day${Math.abs(it.offset)>1?'s':''} ${it.offset<0?'before':'after'} ${fmtShort(utc(state.y,state.m,state.d))}`;
    html += `<div class="dmeta">${chip}<span>${esc(fmt(it.date))}</span><span>· ${esc(rel)}</span></div>`;
    html += `<h2>${esc(it.text)}</h2>`;
    html += `<h4>Sources</h4>`;
    html += it.pages.map(p => srcCard(p, t.color)).join('');
    html += srcCard({title:`Wikipedia · ${it.dayName}`, desc:'The day page where this event is listed', url: it.dayPage}, t.color);
  } else if(it.kind === 'year'){
    html += `<div class="dmeta">${chip}<span>${state.y}</span><span>· highlight from the year</span></div>`;
    html += `<h2>${esc(it.title)}</h2>`;
    if(it.text) html += `<p class="lead">${esc(it.text)}</p>`;
    html += `<h4>Source</h4>` + srcCard({...it.pages[0], extract:''}, t.color);
    html += `<p class="note">Found by searching Wikipedia for ${state.y} articles about ${esc(t.name.toLowerCase())}. It may not fall on this exact date — open the article to see when it happened.</p>`;
  } else {
    html += `<div class="dmeta">${chip}<span>${it.date ? esc(fmt(it.date)) : 'Date not recorded'}</span></div>`;
    html += `<h2>${esc(it.title)}</h2>`;
    if(it.text) html += `<p class="lead">${esc(it.text)}</p>`;
    html += `<h4>Credits</h4><dl class="kv">` +
      (it.artist ? `<dt>Author</dt><dd>${esc(it.artist)}</dd>` : '') +
      (it.credit && it.credit !== it.artist ? `<dt>Credit</dt><dd>${esc(it.credit)}</dd>` : '') +
      (it.license ? `<dt>License</dt><dd>${esc(it.license)}</dd>` : '') + `</dl>`;
    html += `<h4>Source</h4>` + srcCard({title: it.fileName.replace(/^File:/,''), desc:'File page on Wikimedia Commons', url: it.fileUrl, thumb: it.img.thumb}, t.color);
  }
  html += `<p class="note">Text and images are loaded live from Wikipedia and Wikimedia Commons, where they're shared under free licenses. Open a source to read the full story or check image credits.</p>`;
  html = html.replace('</h2>', '</h2><div class="pinrow"><button class="pinbtn" id="pinBtn"></button><a class="pinlink" href="board.html">Open board →</a></div>');
  $('#dbody').innerHTML = html;
  const pinBtn = $('#pinBtn');
  const showPin = (on) => { pinBtn.classList.toggle('on', on); pinBtn.textContent = on ? '✓ Pinned to board' : '📌 Pin to board'; };
  showPin(isPinned(it.id));
  pinBtn.onclick = () => showPin(togglePin(it));
  $('#drawer').scrollTop = 0;
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false');
  $('#scrim').classList.add('on');
  $('#close').focus({preventScroll:true});
}
function closeDrawer(){
  $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true');
  $('#scrim').classList.remove('on');
}
$('#close').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;

/* ================= go ================= */
renderHeader();
renderChips();
renderRange();
updatePinCount();
lastW = $('#board').clientWidth;
setDate(state.y, state.m, state.d, {force:true});
})();
</script>
</body>
</html>
